version: '3.8'

services:
  app:
    build: .
    container_name: html_to_images_service
    ports:
      - "3000:3000"
    environment:
      # 显式告诉 Puppeteer 跳过 Chromium 下载（因为基础镜像里已经有了）
      # 但通常 npm ci 会处理，加上这个保险一点
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PORT=3000
    restart: always